<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>XPI BD Intelligence</title>
<meta name="description" content="XPI BD Intelligence — capture any business and get AI-researched, evidence-backed sales opportunities. White-label ready.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A0E15">
<meta property="og:title" content="XPI BD Intelligence">
<meta property="og:description" content="See the opportunity before you make the pitch.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
:root{
  --ink:#E9EDF3; --surface:#FFFFFF; --surface-2:#F3F6FB; --surface-3:#EAF0F7;
  --line:#D9E1EC; --line-soft:#E7ECF3;
  --text:#131A24; --muted:#5A6879; --faint:#8592A4;
  --accent:#B96C05; --accent-soft:#F6E7CE;
  --verified:#0E9E6E; --verified-bg:#E1F5EC;
  --infer:#2563EB; --infer-bg:#E4EDFF;
  --hypo:#7C3AED; --hypo-bg:#EEE8FF;
  --crit:#D0342C; --crit-bg:#FBE6E4;
  --ring-track:#E4EAF2;
  --shadow:0 1px 2px rgba(15,25,40,.06), 0 8px 30px rgba(15,25,40,.08);
  --frame:#C4CDDA; --frame-2:#AAB6C6;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#080B11; --surface:#121A26; --surface-2:#1A2432; --surface-3:#212D3D;
    --line:#2A3746; --line-soft:#212D3B;
    --text:#E9EEF5; --muted:#93A2B6; --faint:#6B7A8E;
    --accent:#F2A93B; --accent-soft:#3A2E17;
    --verified:#34D399; --verified-bg:#0E2A22;
    --infer:#63A4FF; --infer-bg:#122036;
    --hypo:#A78BFA; --hypo-bg:#221B3A;
    --crit:#F87171; --crit-bg:#301717;
    --ring-track:#26313F;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 18px 50px rgba(0,0,0,.45);
    --frame:#2B3644; --frame-2:#3A4657;
  }
}
:root[data-theme="dark"]{
  --ink:#080B11; --surface:#121A26; --surface-2:#1A2432; --surface-3:#212D3D;
  --line:#2A3746; --line-soft:#212D3B;
  --text:#E9EEF5; --muted:#93A2B6; --faint:#6B7A8E;
  --accent:#F2A93B; --accent-soft:#3A2E17;
  --verified:#34D399; --verified-bg:#0E2A22;
  --infer:#63A4FF; --infer-bg:#122036;
  --hypo:#A78BFA; --hypo-bg:#221B3A;
  --crit:#F87171; --crit-bg:#301717;
  --ring-track:#26313F;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 18px 50px rgba(0,0,0,.45);
  --frame:#2B3644; --frame-2:#3A4657;
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--ink);
  color:var(--text);
  font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  line-height:1.5; -webkit-font-smoothing:antialiased;
  height:100dvh; overflow:hidden;
}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(1200px 720px at 80% -14%, color-mix(in srgb,var(--accent) 18%,transparent), transparent 55%),
    radial-gradient(1000px 760px at 4% 116%, color-mix(in srgb,var(--infer) 15%,transparent), transparent 55%);}
.app{position:relative;z-index:2;width:100%;max-width:540px;margin:0 auto;height:100dvh;
  display:flex;flex-direction:column;overflow:hidden;
  background:color-mix(in srgb,var(--surface) 82%, transparent);
  -webkit-backdrop-filter:blur(22px) saturate(1.15);backdrop-filter:blur(22px) saturate(1.15);
  border-inline:1px solid var(--line-soft);box-shadow:0 0 100px rgba(0,0,0,.42)}
@media(min-width:600px){.app{height:min(940px,96dvh);margin-top:max(0px,calc((100dvh - min(940px,96dvh))/2));border-radius:28px;border:1px solid var(--line-soft)}}

/* ---------- page header ---------- */
.masthead{display:flex; align-items:flex-start; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:30px}
.brand{display:flex; flex-direction:column; gap:10px; max-width:640px}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--accent); font-weight:600}
h1.title{font-family:"Archivo",sans-serif; font-weight:800; font-size:clamp(28px,4.4vw,44px); letter-spacing:-.02em; line-height:1.02; margin:0; text-wrap:balance}
.lede{color:var(--muted); font-size:clamp(14px,1.6vw,16px); max-width:60ch}
.lede b{color:var(--text); font-weight:600}
.head-right{display:flex; flex-direction:column; align-items:flex-end; gap:12px}
.theme-btn{appearance:none;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:7px 8px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:6px;flex:none}
.theme-btn:hover{color:var(--text);border-color:var(--faint)}
.theme-btn .tlbl{display:none}
@media(min-width:600px){.theme-btn .tlbl{display:inline}}
.demo-tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); border:1px dashed var(--line); padding:6px 10px; border-radius:20px}

.layout{display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:38px; align-items:start}
@media(max-width:920px){ .layout{grid-template-columns:1fr} .side{order:-1} }

/* ---------- white-label switch ---------- */
.wl{display:flex;flex-direction:column;align-items:center;gap:9px;margin-bottom:16px}
.wl-lab{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.wl-seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:4px;gap:4px;box-shadow:var(--shadow)}
.wl-seg button{appearance:none;border:none;background:none;cursor:pointer;font-family:"IBM Plex Sans";font-weight:600;font-size:12.5px;color:var(--muted);padding:8px 15px;border-radius:9px;display:flex;align-items:center;gap:8px;transition:background .15s,color .15s}
.wl-seg button .sw{width:11px;height:11px;border-radius:50%;flex:none}
.wl-seg button.on{background:var(--surface-3);color:var(--text)}
.wl-note{font-size:11.5px;color:var(--muted);max-width:360px;text-align:center;line-height:1.45;margin-top:14px}
.wl-note b{color:var(--text);font-weight:600}

/* ---------- phone ---------- */
.stage{display:flex; flex-direction:column; align-items:center}
.phone{
  width:392px; max-width:100%;
  background:linear-gradient(160deg,var(--frame-2),var(--frame));
  border-radius:44px; padding:11px;
  box-shadow:var(--shadow);
}
.screen{
  position:relative; background:var(--surface); border-radius:34px; overflow:hidden;
  height:760px; display:flex; flex-direction:column;
}
.appbar{flex:none;position:relative;z-index:3;padding:13px 15px;display:flex;align-items:center;gap:11px;
  border-bottom:1px solid var(--line-soft);background:color-mix(in srgb,var(--surface-2) 50%,transparent)}
.appbar .back{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);display:none;align-items:center;justify-content:center;cursor:pointer;color:var(--text);flex:none}
.appbar .back svg{width:16px;height:16px}
.appbar.can-back .back{display:flex}
.brandwrap{display:flex;flex-direction:column;gap:1px;min-width:0}
.appbar .mark{font-family:"Archivo";font-weight:800;font-size:16px;letter-spacing:-.02em}
.appbar .mark span{color:var(--accent)}
.appbar .sub{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.appbar .grow{flex:1}
.appbar .badge{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--muted);border:1px solid var(--line);padding:4px 9px;border-radius:20px;white-space:nowrap}

.view{flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch}
.view::-webkit-scrollbar{width:8px}
.view::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.pad{padding:18px 18px 30px}

/* home */
.hi{font-family:"Archivo";font-weight:700;font-size:22px;letter-spacing:-.01em;margin:2px 0 3px}
.hi small{display:block;font-family:"IBM Plex Sans";font-weight:400;font-size:13px;color:var(--muted);letter-spacing:0;margin-top:4px}
.section-h{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:22px 2px 11px;display:flex;align-items:center;gap:8px}
.section-h::after{content:"";flex:1;height:1px;background:var(--line-soft)}
.cap-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.cap{
  background:var(--surface-2);border:1px solid var(--line-soft);border-radius:15px;padding:13px 9px 11px;
  display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;text-align:center;transition:transform .12s,border-color .12s;
}
.cap:hover{transform:translateY(-2px);border-color:var(--accent)}
.cap .ic{width:34px;height:34px;border-radius:11px;background:var(--surface-3);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.cap .ic svg{width:19px;height:19px}
.cap .lb{font-size:11.5px;font-weight:600;line-height:1.15}
.cap .mini{font-family:"IBM Plex Mono",monospace;font-size:8.5px;color:var(--faint);letter-spacing:.05em}

.urlbar{display:flex;gap:8px;margin-top:2px}
.urlbar input{
  flex:1;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 13px;
  color:var(--text);font-family:"IBM Plex Mono",monospace;font-size:12.5px;
}
.urlbar input::placeholder{color:var(--faint)}
.urlbar input:focus{outline:2px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:1px;border-color:var(--accent)}
.btn{
  appearance:none;border:none;cursor:pointer;font-family:"IBM Plex Sans";font-weight:600;font-size:13px;
  background:var(--accent);color:#fff;border-radius:12px;padding:0 16px;display:flex;align-items:center;justify-content:center;gap:7px;
}
:root[data-theme="dark"] .btn, :root:not([data-theme="light"]) .btn{color:#141007}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#141007}}
.btn:hover{filter:brightness(1.06)}
.btn.block{width:100%;padding:13px}
.btn svg{width:15px;height:15px}

.sample{
  display:flex;align-items:center;gap:12px;background:var(--surface-2);border:1px solid var(--line-soft);
  border-radius:15px;padding:12px 13px;cursor:pointer;transition:border-color .12s,transform .12s;margin-bottom:9px;
}
.sample:hover{border-color:var(--accent);transform:translateY(-1px)}
.sample .logo{width:42px;height:42px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-family:"Archivo";font-weight:800;font-size:16px;color:#fff}
.sample .info{flex:1;min-width:0}
.sample .nm{font-weight:600;font-size:14px}
.sample .mt{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sample .go{color:var(--faint)}
.sample .go svg{width:18px;height:18px}

/* research progress */
.research-head{text-align:center;padding:8px 0 6px}
.rh-name{font-family:"Archivo";font-weight:700;font-size:20px;margin-top:14px}
.rh-sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.scanpulse{width:96px;height:96px;margin:8px auto 4px;position:relative}
.scanpulse .core{position:absolute;inset:30px;border-radius:50%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.scanpulse .core svg{width:24px;height:24px}
.scanpulse .r{position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);opacity:0;animation:ping 2s ease-out infinite}
.scanpulse .r:nth-child(2){animation-delay:.66s}
.scanpulse .r:nth-child(3){animation-delay:1.33s}
@keyframes ping{0%{transform:scale(.35);opacity:.7}100%{transform:scale(1);opacity:0}}
.steps{margin-top:20px;display:flex;flex-direction:column;gap:2px}
.step{display:flex;align-items:center;gap:12px;padding:11px 6px;border-radius:10px}
.step .st{width:22px;height:22px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;border:2px solid var(--line);background:var(--surface)}
.step .st svg{width:12px;height:12px}
.step .lbl{font-size:13.5px;font-weight:500;color:var(--faint)}
.step .meta{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--faint);opacity:0}
.step[data-s="active"] .st{border-color:var(--accent);color:var(--accent);animation:spin 1s linear infinite}
.step[data-s="active"] .lbl{color:var(--text)}
.step[data-s="done"] .st{border-color:var(--verified);background:var(--verified);color:#fff}
.step[data-s="done"] .lbl{color:var(--text)}
.step[data-s="done"] .meta{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
.partial-note{margin-top:16px;background:var(--infer-bg);border:1px solid color-mix(in srgb,var(--infer) 30%,transparent);border-radius:12px;padding:11px 13px;font-size:12px;color:var(--text);display:flex;gap:9px;align-items:flex-start}
.partial-note svg{width:16px;height:16px;color:var(--infer);flex:none;margin-top:1px}

/* intelligence header */
.iq-head{padding:16px 18px 14px;background:linear-gradient(180deg,var(--surface-2),var(--surface));border-bottom:1px solid var(--line-soft)}
.iq-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.iq-name{font-family:"Archivo";font-weight:700;font-size:20px;letter-spacing:-.01em;line-height:1.05}
.iq-loc{font-size:12px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:6px}
.conf-pill{font-family:"IBM Plex Mono",monospace;font-size:10px;padding:3px 8px;border-radius:20px;background:var(--verified-bg);color:var(--verified);font-weight:600;letter-spacing:.03em;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.ring-wrap{display:flex;align-items:center;gap:16px;margin-top:16px}
.ring{position:relative;width:92px;height:92px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num{font-family:"Archivo";font-weight:800;font-size:28px;line-height:1}
.ring .of{font-family:"IBM Plex Mono",monospace;font-size:9px;color:var(--faint);letter-spacing:.1em}
.rel-block{flex:1;min-width:0}
.rel-lab{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:7px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:11px;font-weight:600;padding:5px 9px;border-radius:8px;border:1px solid transparent;display:inline-flex;align-items:center;gap:5px}
.pill.primary{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 32%,transparent)}
.pill.sec{background:var(--surface-3);color:var(--text);border-color:var(--line)}
.pill .dotv{width:6px;height:6px;border-radius:50%;background:currentColor}

/* tabs */
.tabs{display:flex;gap:0;padding:0 4px;background:var(--surface);border-bottom:1px solid var(--line-soft);position:sticky;top:0;z-index:5;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 1 auto;appearance:none;border:none;background:none;cursor:pointer;padding:12px 4px;font-family:"IBM Plex Sans";font-weight:600;font-size:11px;letter-spacing:-.01em;color:var(--faint);border-bottom:2px solid transparent;white-space:nowrap;text-align:center}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);border-bottom-color:var(--accent)}

.tabpane{display:none}
.tabpane.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* generic card */
.card{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:15px;padding:14px;margin-bottom:12px}
.card-h{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:10px;display:flex;align-items:center;gap:7px}
.card-h .ic{color:var(--accent);display:flex}.card-h .ic svg{width:14px;height:14px}

/* strategy blocks */
.strat{padding:13px;border-radius:13px;background:var(--surface-2);border:1px solid var(--line-soft);margin-bottom:11px}
.strat.primary{background:linear-gradient(180deg,var(--accent-soft),transparent);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.strat .k{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.strat .v{font-size:13.5px;margin-top:4px}
.strat .v b{font-weight:700}

/* score bars */
.scorebar{margin-bottom:11px}
.scorebar .row{display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:5px}
.scorebar .row .lb{color:var(--muted);font-weight:500}
.scorebar .row .nn{font-family:"IBM Plex Mono",monospace;font-weight:600;font-variant-numeric:tabular-nums}
.track{height:7px;border-radius:6px;background:var(--ring-track);overflow:hidden}
.track i{display:block;height:100%;border-radius:6px;background:var(--accent);transition:width .9s cubic-bezier(.2,.7,.2,1)}
.track.tv i{background:var(--verified)}
.track.ti i{background:var(--infer)}
.track.tc i{background:var(--crit)}

/* evidence */
.claim{border:1px solid var(--line-soft);border-radius:14px;padding:12px 13px;margin-bottom:11px;background:var(--surface-2)}
.claim-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.tier{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;padding:3px 7px;border-radius:6px}
.tier.verified{background:var(--verified-bg);color:var(--verified)}
.tier.infer{background:var(--infer-bg);color:var(--infer)}
.tier.hypo{background:var(--hypo-bg);color:var(--hypo)}
.claim-conf{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);font-weight:600}
.claim-txt{font-size:13.5px;line-height:1.45}
.claim-ex{font-size:11.5px;color:var(--muted);font-style:italic;border-left:2px solid var(--line);padding-left:9px;margin-top:8px;line-height:1.4}
.claim-src{display:flex;align-items:center;gap:6px;margin-top:9px;font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--faint);flex-wrap:wrap}
.claim-src .chip{background:var(--surface-3);border-radius:6px;padding:2px 6px;display:inline-flex;align-items:center;gap:4px}
.claim-src svg{width:11px;height:11px}

/* opportunity */
.opp{border:1px solid var(--line-soft);border-radius:15px;padding:0;overflow:hidden;margin-bottom:12px;background:var(--surface-2)}
.opp-h{display:flex;align-items:center;gap:10px;padding:12px 13px;border-bottom:1px solid var(--line-soft)}
.opp-h .rank{font-family:"Archivo";font-weight:800;font-size:13px;color:var(--accent);background:var(--accent-soft);width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none}
.opp-h .ti{font-weight:700;font-size:14px;flex:1;line-height:1.15}
.opp-h .pc{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;color:var(--verified)}
.opp-body{padding:12px 13px}
.opp-row{display:flex;gap:9px;margin-bottom:9px}
.opp-row:last-child{margin-bottom:0}
.opp-row .rk{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);width:74px;flex:none;padding-top:2px}
.opp-row .rv{font-size:12.5px;line-height:1.4}
.opp-row .rv b{font-weight:600}
.match-tag{display:inline-flex;align-items:center;gap:6px;background:var(--surface-3);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12px;font-weight:600;margin-top:2px}
.match-tag .pr{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);font-weight:500}
.statusline{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--faint);margin-top:10px;display:flex;align-items:center;gap:6px}
.statusline .d{width:5px;height:5px;border-radius:50%;background:var(--verified)}

/* NBA */
.nba{background:linear-gradient(155deg,var(--accent-soft),transparent);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:16px;padding:15px;margin-bottom:14px}
.nba .tag{display:inline-flex;align-items:center;gap:6px;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:8px}
.nba .tag svg{width:13px;height:13px}
.nba .act{font-family:"Archivo";font-weight:700;font-size:17px;line-height:1.15}
.nba .lead{font-size:13px;color:var(--text);margin-top:9px}
.nba .lead b{font-weight:600}
.nba .ask{font-size:13px;font-style:italic;background:var(--surface);border:1px solid var(--line-soft);border-radius:11px;padding:10px 12px;margin-top:10px;line-height:1.4}
.nba .why{font-size:11.5px;color:var(--muted);margin-top:9px;display:flex;gap:7px;align-items:flex-start}
.nba .why svg{width:13px;height:13px;color:var(--accent);flex:none;margin-top:2px}

/* sales play */
.play-item{margin-bottom:12px}
.play-item .k{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);margin-bottom:5px}
.play-item .v{font-size:13px;line-height:1.5}
.play-item ul{margin:0;padding-left:17px}
.play-item li{font-size:13px;margin-bottom:5px;line-height:1.4}
.quote{font-style:italic;background:var(--surface);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:9px 12px;font-size:13px;line-height:1.45}

/* timeline */
.tl{position:relative;padding-left:8px}
.tl-item{position:relative;padding:0 0 4px 26px;border-left:2px solid var(--line);margin-left:8px}
.tl-item:last-child{border-left-color:transparent}
.tl-item .dot{position:absolute;left:-7px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl-item.done .dot{background:var(--verified);border-color:var(--verified)}
.tl-item.next .dot{border-color:var(--accent);background:var(--accent-soft);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 40%,transparent)}50%{box-shadow:0 0 0 5px transparent}}
.tl-date{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.06em;color:var(--faint);text-transform:uppercase}
.tl-ev{font-size:13.5px;font-weight:600;margin:2px 0}
.tl-note{font-size:12px;color:var(--muted);padding-bottom:12px}

.rev{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:2px}
.rev .cell{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:11px 12px}
.rev .cell .n{font-family:"Archivo";font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.rev .cell .n.acc{color:var(--accent)}
.rev .cell .n.ver{color:var(--verified)}
.rev .cell .l{font-size:10.5px;color:var(--muted);margin-top:2px}

/* side rail */
.side{display:flex;flex-direction:column;gap:16px;position:sticky;top:24px}
.rail{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.rail h3{font-family:"Archivo";font-weight:700;font-size:15px;margin:0 0 4px}
.rail .rl-sub{font-size:12.5px;color:var(--muted);margin-bottom:14px}
.principle{display:flex;gap:11px;padding:10px 0;border-top:1px solid var(--line-soft)}
.principle:first-of-type{border-top:none;padding-top:2px}
.principle .pn{width:26px;height:26px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line-soft);display:flex;align-items:center;justify-content:center;color:var(--accent);flex:none}
.principle .pn svg{width:14px;height:14px}
.principle .pt{font-weight:600;font-size:12.5px}
.principle .pd{font-size:11.5px;color:var(--muted);line-height:1.4}
.legend{display:flex;flex-direction:column;gap:9px}
.legend .lg{display:flex;gap:10px;align-items:flex-start;font-size:11.5px}
.legend .sw{width:12px;height:12px;border-radius:4px;flex:none;margin-top:2px}
.legend .lg b{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;display:block}
.legend .lg span{color:var(--muted)}
.disclaimer{font-size:11px;color:var(--faint);line-height:1.5;border-top:1px solid var(--line-soft);padding-top:13px;margin-top:4px}

.foot{text-align:center;margin-top:40px;font-size:11.5px;color:var(--faint);font-family:"IBM Plex Mono",monospace;letter-spacing:.04em}

/* ---------- AVO ---------- */
.avo-sub{font-size:11px;color:var(--muted);text-align:center;line-height:1.4;margin:8px 2px 4px}
.avo-head{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted);margin:14px 2px 10px;line-height:1.35}
.avo-head svg{width:18px;height:18px;color:var(--accent);flex:none}
.avo-head b{color:var(--text);font-weight:600}
.avo-card{padding:13px}
.avo-best{position:relative;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 34%,transparent);border-radius:12px;padding:12px 12px 11px;margin-bottom:8px}
.avo-badge{display:inline-flex;align-items:center;gap:4px;font-family:"IBM Plex Mono",monospace;font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--accent);margin-bottom:7px}
.avo-badge svg{width:11px;height:11px}
.avo-score{float:right;font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.avo-angle{font-weight:700;font-size:13px;margin-bottom:5px;padding-right:34px}
.avo-q{font-style:italic;font-size:12.5px;line-height:1.45}
.avo-subj{font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:4px}
.avo-body{font-size:12.5px;line-height:1.45;white-space:pre-wrap}
.avo-more{appearance:none;border:1px dashed var(--line);background:none;color:var(--muted);border-radius:9px;padding:8px 10px;font-size:12px;font-weight:500;cursor:pointer;width:100%}
.avo-more:hover{color:var(--text);border-color:var(--faint)}
.avo-alts{margin-top:8px;display:flex;flex-direction:column;gap:8px}
.avo-alt{position:relative;border:1px solid var(--line-soft);border-radius:11px;padding:11px;background:var(--surface)}

/* ---------- hero / intro ---------- */
.hero{padding:26px 20px 6px;position:relative}
.hero-eyebrow{display:inline-flex;align-items:center;gap:7px;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:14px;border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);padding:5px 10px;border-radius:20px;background:var(--accent-soft)}
.hero-eyebrow svg{width:13px;height:13px}
.hero-h{font-family:"Archivo";font-weight:800;font-size:clamp(27px,7.6vw,36px);line-height:1.03;letter-spacing:-.028em;margin:0 0 12px;text-wrap:balance}
.hero-h em{font-style:normal;color:var(--accent)}
.hero-sub{color:var(--muted);font-size:13.5px;line-height:1.5;margin:0 0 16px;max-width:44ch}
.hero-sub b{color:var(--text);font-weight:600}
/* animated agentic pipeline */
.pipe{display:flex;align-items:center;gap:0;flex-wrap:wrap;margin:2px 0 4px}
.pipe-step{display:flex;align-items:center;gap:6px;font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:4px 0;animation:pipefire 5s ease-in-out infinite}
.pipe-step .pd{width:7px;height:7px;border-radius:50%;background:var(--line);flex:none;animation:pipedot 5s ease-in-out infinite}
.pipe-arm{width:13px;height:1px;background:var(--line-soft);margin:0 5px}
.pipe-step:nth-of-type(1),.pipe-step:nth-of-type(1) .pd{animation-delay:0s}
.pipe-step:nth-of-type(2),.pipe-step:nth-of-type(2) .pd{animation-delay:.4s}
.pipe-step:nth-of-type(3),.pipe-step:nth-of-type(3) .pd{animation-delay:.8s}
.pipe-step:nth-of-type(4),.pipe-step:nth-of-type(4) .pd{animation-delay:1.2s}
.pipe-step:nth-of-type(5),.pipe-step:nth-of-type(5) .pd{animation-delay:1.6s}
@keyframes pipefire{0%,100%{color:var(--faint)}9%,17%{color:var(--text)}}
@keyframes pipedot{0%,100%{background:var(--line);box-shadow:0 0 0 0 transparent}9%,19%{background:var(--accent);box-shadow:0 0 11px 1px color-mix(in srgb,var(--accent) 75%,transparent)}}
/* scan bar */
.scanbar{display:flex;gap:9px;margin:14px 0 16px}
.scanbar input{flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:15px 15px;color:var(--text);font-family:"IBM Plex Sans";font-size:14px}
.scanbar input::placeholder{color:var(--faint)}
.scanbar input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.scanbar .btn{padding:0 18px;border-radius:14px;font-size:14px;flex:none}
.home-note{font-size:11px;color:var(--faint);text-align:center;line-height:1.4;margin-top:16px}

/* ---------- intro sequence ---------- */
#intro{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(1000px 720px at 50% 36%, color-mix(in srgb,var(--accent) 20%,transparent), transparent 60%), #080B11;transition:opacity .6s ease}
#intro.gone{opacity:0;pointer-events:none}
.intro-inner{display:flex;flex-direction:column;align-items:center;text-align:center;padding:22px;max-width:420px}
.intro-mark{position:relative;margin-bottom:14px;display:flex;align-items:center;justify-content:center;opacity:0;animation:iMark .6s .1s ease forwards}
.intro-mark .ring{position:absolute;inset:0;border-radius:50%;border:2px solid color-mix(in srgb,var(--accent) 55%,transparent);box-shadow:0 0 34px color-mix(in srgb,var(--accent) 40%,transparent),inset 0 0 22px color-mix(in srgb,var(--accent) 25%,transparent);animation:iSpin 3.4s linear infinite}
.intro-mark .ring::after{content:"";position:absolute;top:-3px;left:50%;width:6px;height:6px;border-radius:50%;background:var(--accent);transform:translateX(-50%);box-shadow:0 0 12px 3px var(--accent)}
.intro-mark .ico{color:var(--accent)}
.bdmark{width:min(74vw,370px);height:auto;overflow:visible}
.bdmark text{font-family:"Archivo",system-ui,sans-serif;font-weight:800;font-size:122px;letter-spacing:-6px}
.bdfill{fill:var(--accent);opacity:.85;filter:drop-shadow(0 0 22px color-mix(in srgb,var(--accent) 50%,transparent))}
.bdtrace{fill:none;stroke:#FFF6DA;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:14 70;filter:drop-shadow(0 0 6px var(--accent)) drop-shadow(0 0 2px #fff);animation:bdtrace 1.1s linear infinite}
@keyframes bdtrace{to{stroke-dashoffset:-84}}
.intro-word{font-family:"Archivo";font-weight:800;font-size:clamp(24px,7.5vw,38px);letter-spacing:-.02em;color:#EDF1F7;opacity:0;transform:translateY(14px);animation:iRise .7s .35s ease forwards}
.intro-word span{color:var(--accent)}
.intro-pipe{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.intro-pipe i{font-family:"IBM Plex Mono",monospace;font-style:normal;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#9aa7bb;border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:5px 10px;opacity:0;transform:translateY(8px)}
.intro-pipe i:nth-child(1){animation:iChip .55s .85s ease forwards}
.intro-pipe i:nth-child(2){animation:iChip .55s 1.05s ease forwards}
.intro-pipe i:nth-child(3){animation:iChip .55s 1.25s ease forwards}
.intro-pipe i:nth-child(4){animation:iChip .55s 1.45s ease forwards}
.intro-pipe i:nth-child(5){animation:iChip .55s 1.65s ease forwards}
.intro-tag{margin-top:22px;color:#93a1b5;font-size:13.5px;line-height:1.5;opacity:0;animation:iFade .8s 2s ease forwards}
.intro-skip{position:absolute;bottom:28px;left:0;right:0;text-align:center;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#6b7a8e;opacity:0;animation:iFade .6s 2.5s ease forwards;cursor:pointer}
@keyframes iMark{to{opacity:1}}
@keyframes iSpin{to{transform:rotate(360deg)}}
@keyframes iRise{to{opacity:1;transform:none}}
@keyframes iChip{0%{opacity:0;transform:translateY(8px)}55%{opacity:1;transform:none;color:var(--accent);border-color:color-mix(in srgb,var(--accent) 70%,transparent);box-shadow:0 0 14px color-mix(in srgb,var(--accent) 40%,transparent)}100%{opacity:1;color:var(--muted);border-color:var(--line-soft);box-shadow:none}}
@keyframes iFade{to{opacity:1}}

/* ---------- circuit / pipeline (electric) ---------- */
.circuit{display:flex;align-items:flex-start;gap:0;margin:6px 0 2px;width:100%}
.circuit .node{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0}
.circuit .orb{width:18px;height:18px;border-radius:50%;background:var(--surface-3);border:2px solid var(--line);position:relative;transition:background .3s,border-color .3s,box-shadow .3s;flex:none}
.circuit .nlabel{font-family:"IBM Plex Mono",monospace;font-size:8.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);text-align:center;line-height:1.1;transition:color .3s;white-space:nowrap}
.circuit .wire{flex:1 1 auto;height:3px;background:var(--line-soft);border-radius:3px;margin-top:8px;position:relative;overflow:hidden;min-width:10px}
.circuit .wire::before{content:"";position:absolute;top:0;bottom:0;left:-45%;width:45%;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:0}
.circuit .node.lit .orb{background:var(--accent);border-color:var(--accent);box-shadow:0 0 18px 3px color-mix(in srgb,var(--accent) 75%,transparent),inset 0 0 4px 1px rgba(255,255,255,.7)}
.circuit .node.lit .nlabel{color:var(--text)}
.circuit .node.lit .orb::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:1px solid color-mix(in srgb,var(--accent) 55%,transparent);animation:spark .55s ease-out}
@keyframes spark{from{opacity:.95;transform:scale(.5)}to{opacity:0;transform:scale(1.75)}}
.circuit .wire.done{background:color-mix(in srgb,var(--accent) 55%,var(--line-soft))}
.circuit .wire.flow::before{opacity:1;animation:current .55s linear infinite}
@keyframes current{from{left:-45%}to{left:100%}}
.circuit.ambient .orb{animation:ambpulse 4.8s ease-in-out infinite;animation-delay:calc(var(--i,0)*.5s)}
.circuit.ambient .nlabel{animation:amblabel 4.8s ease-in-out infinite;animation-delay:calc(var(--i,0)*.5s)}
.circuit.ambient .wire::before{opacity:1;animation:current 2.6s linear infinite;animation-delay:calc(var(--i,0)*.5s)}
@keyframes ambpulse{0%,100%{background:var(--surface-3);border-color:var(--line);box-shadow:0 0 0 0 transparent}10%,18%{background:var(--accent);border-color:var(--accent);box-shadow:0 0 16px 3px color-mix(in srgb,var(--accent) 70%,transparent)}}
@keyframes amblabel{0%,100%{color:var(--faint)}10%,18%{color:var(--text)}}
.research-wrap{padding:26px 16px}
.rstatus{text-align:center;font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.05em;color:var(--muted);margin-top:26px;min-height:16px}
.rstatus b{color:var(--accent);font-weight:600}

/* ---------- onboarding ---------- */
.ob{display:flex;flex-direction:column;min-height:100%}
.ob-bar{height:3px;background:var(--line-soft);flex:none}
.ob-bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .4s ease}
.ob-body{padding:28px 20px 28px;display:flex;flex-direction:column;gap:13px;flex:1;min-height:calc(100% - 3px)}
.ob-hero{width:56px;height:56px;border-radius:16px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:2px}
.ob-hero svg{width:28px;height:28px}
.ob-h{font-family:"Archivo";font-weight:800;font-size:23px;letter-spacing:-.02em;margin:0;text-wrap:balance}
.ob-p{color:var(--muted);font-size:13.5px;line-height:1.5;margin:0}
.ob-label{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:6px 0 -5px}
.ob-input{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:13px;color:var(--text);font-family:"IBM Plex Sans";font-size:14px;width:100%}
.ob-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.ob-choice{display:flex;gap:10px}
.ob-opt{flex:1;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:14px;padding:15px 12px;cursor:pointer;text-align:center;transition:border-color .15s,background .15s}
.ob-opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.ob-opt .oi{color:var(--accent);display:flex;justify-content:center;margin-bottom:8px}.ob-opt .oi svg{width:22px;height:22px}
.ob-opt .ot{font-weight:700;font-size:13.5px}.ob-opt .od{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.35}
.prow{display:flex;gap:8px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:12px;padding:10px;margin-bottom:8px}
.prow .pfields{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.prow input{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 10px;color:var(--text);font-size:13px;width:100%}
.prow input:focus{outline:none;border-color:var(--accent)}
.prow .prm{border:1px solid var(--line);background:var(--surface);color:var(--faint);border-radius:9px;width:30px;height:30px;cursor:pointer;flex:none;font-size:13px}
.ob-add{border:1px dashed var(--line);background:none;color:var(--muted);border-radius:11px;padding:11px;cursor:pointer;font-size:13px;font-weight:500;width:100%}
.ob-add:hover{border-color:var(--accent);color:var(--text)}
.ob-swatches{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.ob-sw{width:36px;height:36px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .1s}
.ob-sw.sel{border-color:var(--text);transform:scale(1.12)}
.ob-spacer{flex:1;min-height:14px}
/* account + prospects */
.acct{display:flex;align-items:center;gap:11px;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:14px;padding:11px 13px;margin-bottom:14px}
.acct .av{width:36px;height:36px;border-radius:11px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-family:"Archivo";font-weight:800;font-size:15px;flex:none}
.acct .ai{flex:1;min-width:0}.acct .an{font-weight:600;font-size:13.5px}.acct .as{font-size:11.5px;color:var(--muted)}
.acct .abtn{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:9px;padding:7px 11px;font-size:11.5px;cursor:pointer;flex:none}
.acct .abtn:hover{color:var(--text);border-color:var(--faint)}
.plist .prospect{display:flex;align-items:center;gap:11px;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:13px;padding:11px 12px;cursor:pointer;margin-bottom:8px;color:var(--faint)}
.plist .prospect:hover{border-color:var(--accent)}
.plist .prospect svg{width:18px;height:18px}
.pscore{width:38px;height:38px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-family:"Archivo";font-weight:800;font-size:14px;flex:none}
.prospect .an{font-weight:600;font-size:13.5px;color:var(--text)}.prospect .as{font-size:11.5px;color:var(--muted)}
.prosp-btn{width:100%;background:var(--surface-2);color:var(--text);border:1px solid var(--line-soft);border-radius:12px;padding:12px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.prosp-btn:hover{border-color:var(--accent)}.prosp-btn svg{width:15px;height:15px;color:var(--accent)}

@media (prefers-reduced-motion:reduce){
  #fx{display:none}
  #intro{display:none}
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<canvas id="fx" aria-hidden="true"></canvas>
<div id="intro">
  <div class="intro-inner">
    <div class="intro-mark"><svg class="bdmark" viewBox="0 0 240 140" xmlns="http://www.w3.org/2000/svg" aria-label="BD"><text class="bdfill" x="120" y="108" text-anchor="middle">BD</text><text class="bdtrace" x="120" y="108" text-anchor="middle">BD</text></svg></div>
    <div class="intro-word">BD<span>·</span>INTELLIGENCE</div>
    <div class="intro-pipe"><i>Capture</i><i>Research</i><i>Evidence</i><i>Score</i><i>Play</i></div>
    <div class="intro-tag">See the opportunity before you make the pitch.</div>
  </div>

</div>
<div class="app">
          <div class="appbar" id="appbar">
            <div class="back" id="backBtn" role="button" tabindex="0" aria-label="Back">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg>
            </div>
            <div class="brandwrap">

/* ---------- pipeline circuit ---------- */
const CIRCUIT_STAGES=['Capture','Research','Evidence','Score','Play'];
function circuitHTML(cls){
  let h='<div class="circuit '+(cls||'')+'">';
  CIRCUIT_STAGES.forEach((lab,i)=>{
    h+='<div class="node" style="--i:'+i+'"><span class="orb"></span><span class="nlabel">'+lab+'</span></div>';
    if(i<CIRCUIT_STAGES.length-1) h+='<span class="wire" style="--i:'+i+'"></span>';
  });
  return h+'</div>';
}

/* ---------- voice capture ---------- */
function startVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const inp=document.getElementById('urlIn');
  if(!SR){ if(inp){ inp.focus(); inp.placeholder='Voice needs a supported browser — type the business name'; } return; }
  const r=new SR(); r.lang='en-US'; r.interimResults=false; r.maxAlternatives=1;
  if(inp){ inp.placeholder='🎙 Listening… say the business name'; }
  r.onresult=e=>{ const t=(e.results[0][0].transcript||'').trim(); if(!t){ return; } if(inp) inp.value=t; startLive({name:t,url:''}); };
  r.onerror=ev=>{ if(inp) inp.placeholder=(ev.error==='not-allowed')?'Microphone blocked — allow it, or type the name':'Didn’t catch that — tap Voice again or type it'; };
  r.onend=()=>{ if(inp && inp.placeholder.indexOf('Listening')>-1) inp.placeholder='Enter a website or business name…'; };
  try{ r.start(); }catch(_){ if(inp) inp.focus(); }
}

/* ---------- RESEARCH ---------- */
const LIVE_STEPS=['Reading input','Resolving identity','Fetching website (safe)','Web search','Collecting evidence','Scoring opportunity','BD strategy'];
const CARD_STEPS=['Reading business card','Resolving identity','Fetching website (safe)','Web search','Collecting evidence','Scoring opportunity','BD strategy'];
const SAMPLE_STEPS=['Reading capture','Resolving identity','Fetching website (safe)','Digital audit','Collecting evidence','Scoring opportunity','BD strategy'];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function startSample(id){ const b=DB[id]; showResearch({ name:b.name, sub:b.loc, steps:SAMPLE_STEPS, id, dataPromise:Promise.resolve(b) }); }

function startLive({name,url}){
  const disp=name||url;
  const p=fetch('/api/research',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,url,catalog:ACTIVE_CATALOG})})
    .then(r=>r.json()).then(d=>{ if(d.error) throw new Error(d.message||d.error); return d; });
  showResearch({ name:disp, sub:'Live AI research', id:'_live', dataPromise:p });
}

async function startCard(file){
  let b64; try{ b64=await fileToBase64(file); }catch(e){ return showError('Could not read that image.'); }
  const mediaType=file.type||'image/jpeg';
  const p=fetch('/api/extract',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({imageBase64:b64,mediaType})})
    .then(r=>r.json()).then(fields=>{ if(fields.error) throw new Error(fields.message||fields.error);
      const nm=fields.company||fields.name||''; const url=fields.website||'';
      if(!nm && !url) throw new Error('No business name or website could be read from that card.');
      return fetch('/api/research',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:nm,url,catalog:ACTIVE_CATALOG})})
        .then(r=>r.json()).then(d=>{ if(d.error) throw new Error(d.message||d.error); return d; });
    });
  showResearch({ name:'Business card', sub:'Reading card…', id:'_live', dataPromise:p });
}
function fileToBase64(file){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(String(fr.result).split(',')[1]); fr.onerror=rej; fr.readAsDataURL(file); }); }

async function showResearch({name,sub,id,dataPromise}){
  setChrome('Researching','Live',false);
  view.innerHTML=`<div class="research-wrap">
    <div class="research-head">
      <div class="scanpulse"><span class="r"></span><span class="r"></span><span class="r"></span><span class="core">${I.scan}</span></div>
      <div class="rh-name">${esc(name)}</div>
      <div class="rh-sub">${esc(sub||'')}</div>
    </div>
    ${circuitHTML('')}
    <div class="rstatus" id="rstatus"><b>Capturing…</b></div>
  </div>`;
  let data=null, err=null;
  dataPromise.then(d=>{data=d;}).catch(e=>{err=e;});
  const nodes=[...view.querySelectorAll('.circuit .node')];
  const wires=[...view.querySelectorAll('.circuit .wire')];
  const status=document.getElementById('rstatus');
  const labels=['Capturing the business…','Researching across the web…','Collecting the evidence…','Scoring the opportunity…','Building the play…'];
  const d=reduce?60:560;
  for(let i=0;i<nodes.length;i++){
    if(i>0){ const wi=wires[i-1]; wi.classList.add('flow'); await sleep(d); wi.classList.remove('flow'); wi.classList.add('done'); }
    if(i===nodes.length-1){
      if(status) status.innerHTML='<b>Finalizing the play…</b>';
      const wi=wires[i-1]; if(wi) wi.classList.add('flow');
      while(!data && !err){ await sleep(150); }
      if(wi){ wi.classList.remove('flow'); wi.classList.add('done'); }
    }
    nodes[i].classList.add('lit');
    if(status && labels[i]) status.innerHTML='<b>'+labels[i]+'</b>';
    await sleep(reduce?30:300);
  }
  while(!data && !err){ await sleep(150); }
  if(err){ showError(err.message||'Research failed.'); return; }
  DB[id]=data; if(id==='_live') saveProspect(data); renderIntel(id);
}

function showError(msg){
  setChrome('Research','Home',false);
  view.innerHTML=`<div class="pad">
    <div class="card" style="border-color:var(--crit);background:var(--crit-bg)">
      <div class="card-h" style="color:var(--crit)"><span class="ic">${I.info}</span>Research could not complete</div>
      <div style="font-size:13px;color:var(--text);line-height:1.5">${esc(msg)}</div>
    </div>
    <button class="btn block" id="errBack">Back to capture</button>
  </div>`;
  const bb=document.getElementById('errBack'); if(bb) bb.onclick=renderHome;
}

function paint(id,tab){
  const b=DB[id]; const p=document.getElementById('pane');
  if(tab==='overview') p.innerHTML=ovHTML(b);
  else if(tab==='evidence') p.innerHTML=evHTML(b);
  else if(tab==='opps') p.innerHTML=oppHTML(b);
  else if(tab==='strategy') p.innerHTML=stratHTML(b);
  else if(tab==='timeline') p.innerHTML=tlHTML(b);
  if(tab==='overview'){ requestAnimationFrame(()=>{ p.querySelectorAll('.track i').forEach(el=>{ el.style.width=el.dataset.w+'%'; }); }); }
  if(tab==='strategy'){ const ab=document.getElementById('avoBtn'); if(ab) ab.onclick=()=>runAVO(id); }
  p.scrollIntoView?null:null;
  view.scrollTop = view.scrollTop; // keep position
}

/* ---------- Agentic Variation Operators (AVO) ---------- */
async function runAVO(id){
  const btn=document.getElementById('avoBtn'), out=document.getElementById('avoOut');
  if(!btn||!out) return;
  const orig=btn.innerHTML; btn.disabled=true; btn.innerHTML=I.loader+' Generating variations…';
  out.innerHTML='';
  try{
    const r=await fetch('/api/variations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({intel:DB[id]})});
    const d=await r.json(); if(d.error) throw new Error(d.message||d.error);
    DB[id]._avo=d; out.innerHTML=avoHTML(d); wireAvo(); btn.style.display='none';
  }catch(e){
    out.innerHTML=`<div class="card" style="border-color:var(--crit);background:var(--crit-bg)"><div style="font-size:13px;color:var(--text)">${esc(e.message||'Could not generate variations.')}</div></div>`;
    btn.disabled=false; btn.innerHTML=orig;
  }
}
function avoScore(v){ return `<span class="avo-score">${v.score}</span>`; }
function avoBadge(){ return `<span class="avo-badge">${I.star} Best</span>`; }
function avoBlock(title,icon,items,renderItem){
  if(!items||!items.length) return '';
  const best=items.find(x=>x.best)||items[0];
  const alts=items.filter(x=>x!==best);
  return `<div class="card avo-card">
    <div class="card-h"><span class="ic">${icon}</span>${title}</div>
    <div class="avo-best">${avoBadge()}${avoScore(best)}${renderItem(best)}</div>
    ${alts.length?`<button class="avo-more" data-toggle>▾ ${alts.length} alternate${alts.length>1?'s':''}</button>
      <div class="avo-alts" hidden>${alts.map(a=>`<div class="avo-alt">${avoScore(a)}${renderItem(a)}</div>`).join('')}</div>`:''}
  </div>`;
}
function avoHTML(d){
  const pitch=avoBlock('Pitch angle',I.chat,d.pitch,v=>`<div class="avo-angle">${esc(v.angle)}</div><div class="avo-q">${esc(v.opening)}</div>`);
  const outreach=avoBlock('Outreach draft',I.doc,d.outreach,v=>`<div class="avo-angle">${esc(v.channel)} · ${esc(v.label)}</div>${v.subject?`<div class="avo-subj">Subject: ${esc(v.subject)}</div>`:''}<div class="avo-body">${esc(v.body)}</div>`);
  const strat=avoBlock('Strategy',I.target,d.strategy,v=>`<div class="avo-angle">${esc(v.label)}</div><div class="avo-q" style="font-style:normal">${esc(v.rationale)}</div>`);
  const nba=avoBlock('Next best action',I.bolt,d.nba,v=>`<div class="avo-angle">${esc(v.action)}</div><div class="avo-q" style="font-style:normal">${esc(v.why)}</div>`);
  return `<div class="avo-head">${I.avo}<span>Agentic Variation Operators — <b>best of each, alternates one tap away</b></span></div>${pitch}${outreach}${strat}${nba}`;
}
function wireAvo(){
  document.querySelectorAll('#avoOut [data-toggle]').forEach(b=>b.onclick=()=>{
    const alts=b.nextElementSibling; if(!alts) return;
    const hidden=alts.hasAttribute('hidden');
    if(hidden){ alts.removeAttribute('hidden'); b.textContent='▴ hide alternates'; }
    else { alts.setAttribute('hidden',''); b.textContent='▾ '+alts.children.length+' alternate'+(alts.children.length>1?'s':''); }
  });
}

function ovHTML(b){
  return `
  <div class="strat primary"><div class="k">Primary strategy</div><div class="v"><b>${b.strat.primary}</b></div><div class="v" style="color:var(--muted);font-size:12px;margin-top:6px">${b.strat.primaryWhy}</div></div>
  <div class="strat"><div class="k">Secondary strategy</div><div class="v">${b.strat.secondary}</div></div>
  <div class="card">
    <div class="card-h"><span class="ic">${I.grid}</span>Score breakdown</div>
    ${b.comps.map(c=>`<div class="scorebar"><div class="row"><span class="lb">${c.l}</span><span class="nn">${c.v}</span></div><div class="track ${c.c==='v'?'tv':c.c==='i'?'ti':c.c==='c'?'tc':''}"><i data-w="${c.v}" style="width:0"></i></div></div>`).join('')}
    <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--faint);margin-top:4px">Formula v1.3 · component-weighted · close difficulty inverse-scaled</div>
  </div>
  <div class="card">
    <div class="card-h"><span class="ic">${I.target}</span>Revenue snapshot</div>
    <div class="rev">${b.revenue.map(r=>`<div class="cell"><div class="n ${r.c}">${r.n}</div><div class="l">${r.l}</div></div>`).join('')}</div>
  </div>
  <div class="card">
    <div class="card-h"><span class="ic">${I.check}</span>Identity resolution</div>
    <div style="font-size:12.5px;color:var(--muted);line-height:1.5">Matched at <b style="color:var(--verified)">${(b.identity*100).toFixed(0)}% confidence</b> on: ${b.matched.join(' · ')}. Above threshold — research proceeded automatically.</div>
  </div>`;
}
function evHTML(b){
  return `<div style="font-size:12px;color:var(--muted);margin-bottom:12px">Every finding below carries a source, an excerpt, a timestamp and a confidence. Nothing is presented as fact without it.</div>` +
  b.claims.map(c=>`
  <div class="claim">
    <div class="claim-top"><span class="tier ${c.tier==='verified'?'verified':c.tier==='infer'?'infer':'hypo'}">${c.tier==='verified'?'Verified':c.tier==='infer'?'Inference':'Hypothesis'}</span><span class="claim-conf">${c.conf}%</span></div>
    <div class="claim-txt">${c.txt}</div>
    <div class="claim-ex">${c.ex}</div>
    <div class="claim-src"><span class="chip">${I.link}${c.src}</span><span class="chip">${c.stype}</span><span class="chip">${I.clock}${c.date}</span></div>
  </div>`).join('');
}
function oppHTML(b){
  return b.opps.map(o=>`
  <div class="opp">
    <div class="opp-h"><span class="rank">${o.rank}</span><span class="ti">${o.ti}</span><span class="pc">${o.pc}</span></div>
    <div class="opp-body">
      <div class="opp-row"><span class="rk">Finding</span><span class="rv">${o.finding}</span></div>
      <div class="opp-row"><span class="rk">Impact</span><span class="rv">${o.impact}</span></div>
      <div class="opp-row"><span class="rk">${catLabel()}</span><span class="rv"><span class="match-tag">${I.bolt}${prodFor(o).n}<span class="pr">${prodFor(o).p}</span></span></span></div>
      <div class="statusline"><span class="d"></span>${o.status}</div>
    </div>
  </div>`).join('');
}
function stratHTML(b){
  let html=`
  <div class="nba">
    <div class="tag">${I.bolt} Next best action</div>
    <div class="act">${b.nba.act}</div>
    <div class="lead">${b.nba.lead}</div>
    <div class="ask">${b.nba.ask}</div>
    <div class="why">${I.info}<span>${b.nba.avoid}</span></div>
  </div>`;
  if(b.bdplay){
    html+=`<div class="card">
      <div class="card-h"><span class="ic">${I.target}</span>BD / partnership play</div>
      <div class="play-item"><div class="k">Objective</div><div class="v"><b>${b.bdplay.obj}</b></div></div>
      <div class="play-item"><div class="k">Why</div><div class="v">${b.bdplay.why}</div></div>
      <div class="play-item"><div class="k">Opening</div><div class="quote">${b.bdplay.opening}</div></div>
      <div class="play-item"><div class="k">Next goal</div><div class="v">${b.bdplay.goal}</div></div>
    </div>`;
  }
  html+=`<div class="card">
    <div class="card-h"><span class="ic">${I.chat}</span>Sales play</div>
    <div class="play-item"><div class="k">Opening</div><div class="quote">${b.play.opening}</div></div>
    <div class="play-item"><div class="k">Discovery questions</div><div class="v"><ul>${b.play.discovery.map(q=>`<li>${q}</li>`).join('')}</ul></div></div>
    <div class="play-item"><div class="k">Value proposition</div><div class="v">${b.play.value}</div></div>
    <div class="play-item"><div class="k">Product recommendation</div><div class="v"><span class="match-tag">${I.bolt}${playProd(b)}</span></div></div>
    <div class="play-item"><div class="k">Objection handling</div><div class="v"><ul>${b.play.objection.map(q=>`<li>${q}</li>`).join('')}</ul></div></div>
    <div class="play-item"><div class="k">Close</div><div class="quote">${b.play.close}</div></div>
  </div>
  <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--faint);text-align:center;padding:4px 0 8px">Draft generated from evidence + vertical playbook + catalog · rep edits before use</div>
  <button class="btn block" id="avoBtn" style="margin-top:2px">${I.avo} Agentic Variation Operators</button>
  <div class="avo-sub">Generate multiple pitch, outreach, strategy &amp; next-action variations — an evaluator auto-picks the best of each.</div>
  <div id="avoOut"></div>`;
  return html;
}
function tlHTML(b){
  return `<div class="card" style="background:transparent;border:none;padding:4px 0">
    <div class="tl">${b.timeline.map(t=>`
      <div class="tl-item ${t.s}"><span class="dot"></span>
        <div class="tl-date">${t.date}</div>
        <div class="tl-ev">${t.ev}</div>
        <div class="tl-note">${t.note}</div>
      </div>`).join('')}</div>
  </div>
  <div style="font-size:11.5px;color:var(--muted);text-align:center;padding:6px 10px">Immutable relationship history — every capture, research run, and interaction is logged and auditable.</div>`;
}

/* ---------- theme ---------- */
const root=document.documentElement, tb=document.getElementById('themeBtn'), tl=document.getElementById('themeLbl'), ti=document.getElementById('themeIcon');
const moon='<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>';
const sun='<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M6 6 4.5 4.5M19.5 19.5 18 18M18 6l1.5-1.5M4.5 19.5 6 18"/>';
function sysDark(){ return window.matchMedia('(prefers-color-scheme: dark)').matches; }
function applyTheme(t){ if(t){ root.setAttribute('data-theme',t); } const dark = t? t==='dark' : sysDark(); ti.innerHTML = dark?sun:moon; tl.textContent = dark?'Light':'Dark'; }
tb.onclick=()=>{ const cur=root.getAttribute('data-theme'); const goingDark = cur? cur!=='dark' : !sysDark(); applyTheme(goingDark?'dark':'light'); };
applyTheme(null);

/* ---------- white-label: brand + catalog ---------- */
const CATALOG = {
  xpi:{}, // xpi uses each opportunity's own product/price
  momentum:{
    concierge:{n:'AI Answering & Booking',p:'$349/mo'},
    booking:{n:'Online Booking Setup',p:'$249 setup'},
    reviews:{n:'Reputation Builder',p:'$129/mo'},
    enrollment:{n:'Client Onboarding Automation',p:'$299/mo'},
    enterprise:{n:'Multi-Site Rollout',p:'custom'},
    partner:{n:'Referral Partner Program',p:'—'},
    intake:{n:'Lead Intake & Routing',p:'$179/mo'},
    crm:{n:'CRM + Follow-up',p:'$199/mo'},
  }
};
const BRANDS = {
  xpi:{label:'XPI', wordmark:'XPI<span>·</span>Intel', accent:null, catalog:'xpi', catName:'XPI match'},
  momentum:{label:'Momentum BD', wordmark:'Momentum<span>·</span>BD', accent:'#3B82F6', catalog:'momentum', catName:'Product match'}
};
let activeBrand='xpi';
// Server-supplied brand profile (falls back to XPI defaults if opened without the server)
let SERVER_CFG={ accent:null, wordmark:'XPI<span>·</span>Intel', productLabel:'XPI match', showWhiteLabel:true };
function catLabel(){ if(PROFILE&&PROFILE.catalog&&PROFILE.catalog.length) return 'Recommended'; return (activeBrand==='xpi') ? (SERVER_CFG.productLabel||BRANDS.xpi.catName) : BRANDS[activeBrand].catName; }
function prodFor(o){ const cat=BRANDS[activeBrand].catalog; if(cat==='xpi'||!o.pkey) return {n:o.product,p:o.price}; const c=CATALOG[cat][o.pkey]; return c?c:{n:o.product,p:o.price}; }
function playProd(b){ const cat=BRANDS[activeBrand].catalog; if(cat==='xpi'||!b.play.pkey) return b.play.product; const c=CATALOG[cat][b.play.pkey]; return c?(c.n+' — '+c.p):b.play.product; }
function applyBrand(k){
  activeBrand=k; const br=BRANDS[k]; const r=document.documentElement.style;
  const accent = br.accent || SERVER_CFG.accent; // 'xpi' base uses the server profile's accent
  if(accent){ r.setProperty('--accent',accent); r.setProperty('--accent-soft','color-mix(in srgb, '+accent+' 16%, transparent)'); }
  else { r.removeProperty('--accent'); r.removeProperty('--accent-soft'); }
  const mk=document.querySelector('#appbar .mark'); if(mk) mk.innerHTML=(k==='xpi'?(SERVER_CFG.wordmark||br.wordmark):br.wordmark);
  if(current) renderIntel(current); else renderHome();
}
document.querySelectorAll('#wlSeg button').forEach(btn=>btn.onclick=()=>{
  document.querySelectorAll('#wlSeg button').forEach(x=>x.classList.remove('on'));
  btn.classList.add('on'); applyBrand(btn.dataset.brand);
});

function applyServerBranding(cfg){
  if(cfg.pageTitle){ document.title=cfg.pageTitle; const t=document.getElementById('pgTitle'); if(t) t.textContent=cfg.pageTitle; }
  if(cfg.eyebrow){ const e=document.getElementById('pgEyebrow'); if(e) e.textContent=cfg.eyebrow; }
  if(cfg.lede){ const l=document.getElementById('pgLede'); if(l) l.innerHTML=cfg.lede; }
  if(cfg.showWhiteLabel===false){ const wl=document.querySelector('.wl'); if(wl) wl.style.display='none'; const wn=document.querySelector('.wl-note'); if(wn) wn.style.display='none'; }
}

// Boot: pull the server profile (branding), then render. Works offline too (keeps XPI defaults).
fetch('/api/config').then(r=>r.json()).then(cfg=>{ SERVER_CFG={...SERVER_CFG,...cfg}; applyServerBranding(SERVER_CFG); })
  .catch(()=>{})
  .finally(()=>{
    setAccent(SERVER_CFG.accent);
    const mk=document.querySelector('#appbar .mark'); if(mk&&SERVER_CFG.wordmark) mk.innerHTML=SERVER_CFG.wordmark;
    const prof=loadProfile();
    if(prof){ applyProfile(prof); renderHome(); }
    else { startOnboarding(); }
  });

/* ---------- intro sequence dismiss ---------- */
(function(){
  const intro=document.getElementById('intro'); if(!intro) return;
  if(reduce){ intro.remove(); return; }
  let killed=false;
  const done=()=>{ if(killed) return; killed=true; intro.classList.add('gone'); setTimeout(()=>{ intro.remove(); },700); };
  const t=setTimeout(done,4100);
  intro.addEventListener('click',()=>{ clearTimeout(t); done(); });
})();

/* ---------- ambient agentic backdrop (neural constellation) ---------- */
(function(){
  const c=document.getElementById('fx'); if(!c) return;
  if(reduce) return;
  const ctx=c.getContext('2d'); let w,h,pts,dpr;
  function accent(){ return (getComputedStyle(root).getPropertyValue('--accent').trim())||'#F2A93B'; }
  function size(){ dpr=Math.min(2,window.devicePixelRatio||1); w=c.width=Math.floor(innerWidth*dpr); h=c.height=Math.floor(innerHeight*dpr); }
  function init(){ size(); const n=Math.max(26,Math.min(64,Math.floor(innerWidth/18))); pts=[]; for(let i=0;i<n;i++) pts.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.12*dpr,vy:(Math.random()-.5)*.12*dpr}); }
  function frame(){ const a=accent(); ctx.clearRect(0,0,w,h);
    for(const p of pts){ p.x+=p.vx;p.y+=p.vy; if(p.x<0||p.x>w)p.vx*=-1; if(p.y<0||p.y>h)p.vy*=-1; }
    const md=150*dpr;
    for(let i=0;i<pts.length;i++){ for(let j=i+1;j<pts.length;j++){ const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,d=Math.hypot(dx,dy); if(d<md){ ctx.strokeStyle=a; ctx.globalAlpha=(1-d/md)*.13; ctx.lineWidth=dpr; ctx.beginPath(); ctx.moveTo(pts[i].x,pts[i].y); ctx.lineTo(pts[j].x,pts[j].y); ctx.stroke(); } } }
    ctx.globalAlpha=.55; ctx.fillStyle=a;
    for(const p of pts){ ctx.beginPath(); ctx.arc(p.x,p.y,1.4*dpr,0,6.283); ctx.fill(); }
    ctx.globalAlpha=1; requestAnimationFrame(frame);
  }
  init(); requestAnimationFrame(frame);
  let t; addEventListener('resize',()=>{ clearTimeout(t); t=setTimeout(init,180); });
})();
</script>
